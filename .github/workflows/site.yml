name: build-site
on:
  schedule:
    - cron: "40 23 * * *"
    - cron: "30 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests matplotlib
      - run: python build_site.py
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json manifest.json icon-192.png icon-512.png apple-touch-icon.png
          git diff --cached --quiet || (git commit -m "update site data" && git pull --rebase && git push)
